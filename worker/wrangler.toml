# Deliberately still "tideline-push" after the app was renamed to Surfcast. This is the
# deployed Worker's service name, and it decides the live URL
# (tideline-push.<subdomain>.workers.dev) that the frontend's VITE_PUSH_API_URL points at.
# Changing it does not rename the running Worker: `wrangler deploy` would publish a *second*
# one under the new name and leave this one serving, so push subscriptions and sessions would
# keep going to the old URL until VITE_PUSH_API_URL was repointed. Rename it deliberately, not
# as part of a cosmetic rename.
name = "tideline-push"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Runs the alert check on a schedule, independent of any request — this is what makes
# notifications arrive while nobody has the app open. Every 30 minutes; see
# src/index.js's NOTIFY_COOLDOWN_MS for how often a still-matching alert can re-fire.
[triggers]
crons = ["*/30 * * * *"]

# One entry per push subscription — see src/store.js. Replace `id` with a real namespace's
# id after running `wrangler kv namespace create SUBSCRIPTIONS` (see README.md).
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# One entry per logged-in account — see src/userStore.js. Replace `id` with a real namespace's
# id after running `wrangler kv namespace create USERS` (see README.md).
[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_WITH_YOUR_USERS_KV_NAMESPACE_ID"

[vars]
# Shown to push services as who to contact about this VAPID identity if something's wrong
# with how it's being used — any mailto: or https: URL you control.
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"
# Safe to commit — VAPID public keys are, by design, not secret. The matching private key is
# NOT set here; see README.md (`wrangler secret put VAPID_PRIVATE_KEY`).
VAPID_PUBLIC_KEY = "REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY"
# CORS: only this origin may call the API. This is the GitHub Pages origin the app is served
# from — origin only, no /App path, since CORS matches on origin.
ALLOWED_ORIGIN = "https://orihillel.github.io"
# OAuth client ids for "Continue with Google" / "Continue with Meta" — both safe to commit,
# same as the VAPID public key: they identify your app, they don't authenticate anything by
# themselves. The matching secrets are NOT set here; see README.md.
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_OAUTH_CLIENT_ID"
FACEBOOK_APP_ID = "REPLACE_WITH_YOUR_FACEBOOK_APP_ID"
