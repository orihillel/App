name: Deploy Push Worker

# Only runs when worker/ actually changes, and only once the required secrets exist — see
# worker/README.md for the one-time Cloudflare account setup this depends on. Until then this
# workflow does nothing harmful; it just never triggers meaningfully (the job's secret check
# below skips it even if manually dispatched before setup is done).
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Secrets go through `env:` rather than being interpolated into the script text. When
      # they were interpolated, a value containing a space or newline was pasted into the `if`
      # as separate words and bash failed the test with "[: too many arguments" — which, because
      # a failing *condition* does not trip `set -e`, silently took the else branch and reported
      # the secrets as configured. So the one check meant to catch a misconfigured secret was
      # itself broken by one. As env vars the values are never parsed as shell words, and the
      # trim below means a stray newline from a copy-paste no longer reads as "configured".
      - name: Check Cloudflare secrets are configured
        id: secrets-check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          token=$(printf '%s' "$CF_API_TOKEN" | tr -d '[:space:]')
          account=$(printf '%s' "$CF_ACCOUNT_ID" | tr -d '[:space:]')
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secrets are not set — skipping deploy. See worker/README.md."
            exit 0
          fi
          # Wrangler rejects an account id containing anything but alphanumerics, hyphens and
          # underscores, and its error prints the value masked as *** — which says nothing about
          # what is wrong with it. Catch it here, where the message can be specific, rather than
          # letting the deploy fail three steps later on an unreadable one.
          case "$account" in
            *[!A-Za-z0-9_-]*)
              echo "::error::CLOUDFLARE_ACCOUNT_ID contains characters Cloudflare does not allow (only letters, digits, hyphens and underscores). It is usually a 32-character hex string — check for a pasted URL, quotes, or surrounding text."
              exit 1
              ;;
          esac
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        if: steps.secrets-check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
