<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap">
  <style>
    body { margin: 0; background: #E9E7DF; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #b45309; } a:hover { color: #92400e; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .grot { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .card { background: #0F2136; border: 1px solid rgba(244,247,246,0.14); border-radius: 10px; }
  </style>
</helmet>

<!-- The app as it renders today: a picture of a phone, drawn inside the phone. -->
<div style="width: 390px; height: 844px; background: #E9E7DF; display: flex; align-items: center; justify-content: center; overflow: hidden;">
  <div style="width: 330px; height: 700px; background: #070F18; border: 6px solid #08141F; border-radius: 44px; overflow: hidden; color: #F4F7F6; box-shadow: 0 30px 60px -20px rgba(11,28,46,0.45); display: flex; flex-direction: column;">

    <!-- painted status bar, on top of the device's real one -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 4px;">
      <span class="mono" style="font-size: 11px; opacity: 0.85;">9:41</span>
      <div style="display: flex; align-items: flex-end; gap: 2px;">
        <div style="width: 3px; height: 4px; background: #F4F7F6; border-radius: 1px;"></div>
        <div style="width: 3px; height: 6px; background: #F4F7F6; border-radius: 1px;"></div>
        <div style="width: 3px; height: 8px; background: #F4F7F6; border-radius: 1px;"></div>
        <div style="width: 3px; height: 10px; background: #F4F7F6; border-radius: 1px;"></div>
        <div style="width: 18px; height: 9px; border: 1.5px solid #F4F7F6; border-radius: 3px; padding: 1.5px; margin-left: 3px;"><div style="width: 70%; height: 100%; background: #F4F7F6; border-radius: 1px;"></div></div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 18px 10px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,246,0.58)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      <span class="grot" style="font-weight: 600; font-size: 11px; letter-spacing: 0.14em; opacity: 0.9;">SURFCAST</span>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="mono" style="font-size: 9px; font-weight: 700; color: rgba(244,247,246,0.58); border: 1px solid rgba(244,247,246,0.14); border-radius: 4px; padding: 3px 6px;">FT</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,246,0.58)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </div>
    </div>

    <div style="padding: 0 18px 10px;">
      <div class="grot" style="font-weight: 700; font-size: 19px; line-height: 1.1;">Lower Trestles</div>
      <div style="font-size: 11px; color: rgba(244,247,246,0.58); margin-top: 3px;">San Clemente, CA</div>
      <div style="font-size: 9px; color: #39E6C4; margin-top: 5px; font-weight: 600; letter-spacing: 0.06em;">YOUR GO-TO SPOT</div>
    </div>

    <!-- fabricated numbers and a failure message, at the same time -->
    <div style="margin: 0 18px; border-radius: 14px; background: #0F2136; border: 1px solid rgba(244,247,246,0.14); padding: 14px; position: relative; overflow: hidden;">
      <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #33465C; opacity: 0.4;"></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="mono" style="background: #33465C; color: rgba(244,247,246,0.58); font-weight: 700; font-size: 9px; letter-spacing: 0.08em; padding: 3px 7px; border-radius: 4px;">LOADING</span>
        <span class="mono" style="font-size: 10px; color: rgba(244,247,246,0.58);">AT 7A</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 7px; margin-top: 10px;">
        <span class="mono" style="font-weight: 700; font-size: 44px; line-height: 1;">3-5</span>
        <span class="mono" style="font-weight: 700; font-size: 13px; color: rgba(244,247,246,0.58);">FT</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 10px;">
        <span class="mono" style="font-size: 10px;">12s SW</span>
        <span class="mono" style="font-size: 10px;">5mph E</span>
      </div>
      <div style="margin-top: 10px; font-size: 10px; background: rgba(0,0,0,0.28); padding: 7px 9px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
        <span>Live data didn't load for this spot.</span>
        <span style="background: #F4F7F6; color: #070F18; border-radius: 6px; padding: 3px 8px; font-size: 9px; font-weight: 600; white-space: nowrap;">Retry</span>
      </div>
    </div>

    <div class="card" style="margin: 12px 18px 0; padding: 10px 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
        <span style="font-size: 8.5px; color: rgba(244,247,246,0.58); letter-spacing: 0.08em; font-weight: 600;">WAVE HEIGHT TODAY</span>
        <span class="mono" style="font-size: 9px; color: rgba(244,247,246,0.58);">3-5ft now</span>
      </div>
      <svg viewBox="0 0 300 56" style="width: 100%; height: 40px;">
        <path d="M8,34 L49,26 L90,17 L131,21 L172,28 L213,36 L254,42 L292,42" fill="none" stroke="#39E6C4" stroke-width="2"/>
        <circle cx="49" cy="26" r="3.5" fill="#FF6A47"/>
      </svg>
      <div style="display: flex; justify-content: space-between; margin-top: 2px;">
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">5a</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">7a</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">9a</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">11a</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">1p</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">3p</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">5p</span>
        <span class="mono" style="font-size: 7.5px; color: rgba(244,247,246,0.58);">7p</span>
      </div>
    </div>

    <div style="display: flex; gap: 7px; padding: 12px 18px 0;">
      <div class="card" style="flex: 1; padding: 9px 9px;">
        <div style="font-size: 8.5px; color: rgba(244,247,246,0.58); letter-spacing: 0.08em; font-weight: 600;">SWELL</div>
        <div class="mono" style="font-weight: 600; font-size: 13px; margin-top: 4px;">3-5ft</div>
        <div style="font-size: 9px; color: rgba(244,247,246,0.58); margin-top: 2px;">12s SW</div>
      </div>
      <div class="card" style="flex: 1; padding: 9px 9px;">
        <div style="font-size: 8.5px; color: rgba(244,247,246,0.58); letter-spacing: 0.08em; font-weight: 600;">WIND</div>
        <div class="mono" style="font-weight: 600; font-size: 13px; margin-top: 4px;">5mph</div>
        <div style="font-size: 9px; color: #39E6C4; margin-top: 2px; font-weight: 600;">E · offshore</div>
      </div>
      <div class="card" style="flex: 1; padding: 9px 9px;">
        <div style="font-size: 8.5px; color: rgba(244,247,246,0.58); letter-spacing: 0.08em; font-weight: 600;">TIDE</div>
        <div class="mono" style="font-weight: 600; font-size: 13px; margin-top: 4px;">3.1ft</div>
        <div style="font-size: 8px; color: rgba(244,247,246,0.58); margin-top: 2px;">Next High 2p</div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; justify-content: space-around; align-items: center; padding: 10px 18px 16px; border-top: 1px solid rgba(244,247,246,0.14);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF6A47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,246,0.58)" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,246,0.58)" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(244,247,246,0.58)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
